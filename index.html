function init(s){const W=S.week,start=W+3,end=s.sb-2,n=end<start?0:Math.max(1,Math.min(6,Math.floor((end-start)/4)+1));

 for(let i=0;i<n;i++){const w=n==1?start:start+Math.round(i*(end-start)/(n-1))+(i&&i<n-1?ri(-1,1):0);s.p.slots.push({w:Math.max(w,start),ph:Math.min(3,1+Math.floor(i*3/n)),done:0})}}
function pickEv(s,ph){const p=s.p,a=S.A[s.art];
 const ks=Object.keys(EV).filter(k=>{const d=EV[k];if(d.sw||d.ph>ph)return false;if(d.one&&p.used.includes(k))return false;return !d.ok||d.ok(s,a,p)});
 if(!ks.length)return null;const wt=ks.map(k=>EV[k].w*(EV[k].ph==ph?2:1)*(EV[k].core?2.5:1)),tot=wt.reduce((t,v)=>t+v,0);let r=R()*tot,i=0;while(i<ks.length-1&&r>=wt[i]){r-=wt[i];i++}return ks[i]}
function pickInc(s){const p=s.p,a=S.A[s.art],ks=['swPower','swWeather','swGuest','swWard'].filter(k=>!EV[k].ok||EV[k].ok(s,a,p));return ks[Math.floor(R()*ks.length)]}
function setPend(s,k,slot){const p=s.p,a=S.A[s.art],d=EV[k];p.pend={k,slot:slot==null?null:slot,d:d.mk?d.mk(s,a,p):{}};showEv(s)}
const isQ=k=>(PCUR&&PCUR.k38==k)||PQ.some(q=>q.k38==k);
function showEv(s){const p=s.p,pe=p.pend,d=pe&&EV[pe.k],a=S.A[s.art];if(!d){p.pend=null;return}
 const v=d.view(pe,s,a,p),me=S.L[0];
